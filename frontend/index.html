<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAI — Sentri Intelligence | AMR Surveillance</title>
<meta name="description" content="Real-time antimicrobial resistance surveillance across Africa. Report cases via Telegram, WhatsApp, and SMS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════
   STAI — Sentri Intelligence
   Cinematic Scrollytelling Dashboard
   ═══════════════════════════════════════════════ */

/* ── Reset ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── Design Tokens ── */
:root {
  --bg-deep: #06090F;
  --bg-surface: #0A0F1A;
  --bg-glass: rgba(255,255,255,0.04);
  --bg-glass-hover: rgba(255,255,255,0.07);
  --border-glass: rgba(255,255,255,0.06);
  --border-glass-hover: rgba(255,255,255,0.12);

  --aurora-1: #4ADE80;
  --aurora-2: #2DD4BF;
  --aurora-3: #A78BFA;
  --accent: #00F0FF;
  --amber: #F59E0B;
  --red: #EF4444;
  --coral: #F97316;
  --purple: #A78BFA;
  --emerald: #2DD4BF;
  --success: #22C55E;

  --text: #EEF0F4;
  --text-dim: #949BA8;
  --text-muted: #5A6170;

  --font-display: 'Syne', sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Satoshi', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  --blur: 24px;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --spring-soft: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ── Base ── */
html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text);
  overflow-x: hidden;
  line-height: 1.6;
}

/* ── Grain Overlay ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 10000;
  pointer-events: none;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
}

/* ── Typography ── */
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; }
.mono { font-family: var(--font-mono); }

/* ── Glass Card ── */
.glass {
  background: var(--bg-glass);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  transition: all 0.4s var(--spring-soft);
}
.glass:hover {
  background: var(--bg-glass-hover);
  border-color: var(--border-glass-hover);
}

/* ── Living Orb ── */
#orb {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  z-index: 9999;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.6s var(--spring), box-shadow 0.6s var(--spring);
}

.orb-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--aurora-1), var(--aurora-2), var(--aurora-3), var(--aurora-1));
  background-size: 200% 200%;
  animation: orbBreathe 4s ease-in-out infinite, orbHue 8s linear infinite;
  box-shadow: 0 0 30px rgba(45,212,191,0.25), 0 0 60px rgba(74,222,128,0.1);
  filter: saturate(1.2);
}

.orb-label {
  position: absolute;
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.3s var(--spring);
  pointer-events: none;
  text-shadow: 0 0 10px rgba(0,240,255,0.5);
}

#orb:hover .orb-label {
  opacity: 1;
  transform: scale(1);
}

#orb:hover {
  transform: scale(1.15);
}

#orb.orb-alert .orb-inner {
  animation: orbBreathe 4s ease-in-out infinite, orbAlert 1s ease-in-out;
  box-shadow: 0 0 40px rgba(239,68,68,0.4), 0 0 80px rgba(239,68,68,0.15);
}

#orb.orb-warn .orb-inner {
  box-shadow: 0 0 30px rgba(245,158,11,0.35), 0 0 60px rgba(245,158,11,0.12);
}

@keyframes orbBreathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

@keyframes orbHue {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}

@keyframes orbAlert {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.3); }
  50% { transform: scale(0.95); }
  75% { transform: scale(1.15); }
}

/* ── Section Base ── */
.section {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  position: relative;
  overflow: hidden;
}

.section-inner {
  max-width: 1200px;
  width: 100%;
  position: relative;
  z-index: 2;
}

/* ── Scroll Reveal ── */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.8s var(--spring-soft), transform 0.8s var(--spring);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-stagger { transition-delay: var(--delay, 0ms); }

/* ── Aurora Mesh Background ── */
.aurora-mesh {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.aurora-mesh::before,
.aurora-mesh::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  animation: auroraShift 8s ease-in-out infinite alternate;
}
.aurora-mesh::before {
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--aurora-1), transparent 70%);
  top: -200px; left: -100px;
}
.aurora-mesh::after {
  width: 500px; height: 500px;
  background: radial-gradient(circle, var(--aurora-3), transparent 70%);
  bottom: -200px; right: -100px;
  animation-delay: -4s;
}

@keyframes auroraShift {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(60px, 40px) scale(1.15); }
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* ── Reduced Motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

/* ── Responsive ── */
@media (max-width: 768px) {
  .section { padding: 60px 16px; }
  h1 { font-size: 2.5rem !important; }
  h2 { font-size: 1.8rem !important; }
}

/* ── Hero Section ── */
#sec-hero {
  text-align: center;
  min-height: 100vh;
  position: relative;
}

.hero-logo {
  font-family: var(--font-display);
  font-size: clamp(3rem, 8vw, 6rem);
  font-weight: 800;
  letter-spacing: -2px;
  background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2), var(--aurora-3));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(30px) scale(0.95);
  animation: heroReveal 1.2s var(--spring) 0.3s forwards, auroraShift 8s ease-in-out infinite alternate;
}

.hero-tagline {
  font-family: var(--font-display);
  font-size: clamp(1rem, 2.5vw, 1.5rem);
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 8px;
  opacity: 0;
  animation: heroReveal 1s var(--spring) 0.8s forwards;
}

.hero-sub {
  font-size: 0.95rem;
  color: var(--text-muted);
  max-width: 480px;
  margin: 0 auto;
  opacity: 0;
  animation: heroReveal 1s var(--spring) 1.2s forwards;
}

@keyframes heroReveal {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.scroll-indicator {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: scrollPulse 2s ease-in-out infinite;
}

@keyframes scrollPulse {
  0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
  50% { opacity: 0.8; transform: translateX(-50%) translateY(8px); }
}

/* ── Crisis Section ── */
#sec-crisis {
  text-align: center;
}

.crisis-headline {
  font-family: var(--font-mono);
  font-size: clamp(4rem, 12vw, 8rem);
  font-weight: 700;
  color: var(--red);
  line-height: 1;
  margin-bottom: 8px;
  text-shadow: 0 0 60px rgba(239,68,68,0.2);
}

.crisis-label {
  font-size: 1.1rem;
  color: var(--text-dim);
  margin-bottom: 48px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  max-width: 900px;
  margin: 0 auto;
}

.stat-card {
  padding: 28px 20px;
  text-align: center;
}

.stat-value {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.stat-change {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  margin-top: 6px;
}
.stat-change.up { color: var(--success); }
.stat-change.down { color: var(--red); }

/* ── Vision Section ── */
#sec-vision {
  text-align: center;
}

.vision-text {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 4vw, 3rem);
  font-weight: 700;
  color: var(--text);
  max-width: 700px;
  margin: 0 auto;
  line-height: 1.3;
}

.vision-text .word {
  display: inline-block;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s var(--spring);
  margin-right: 0.3em;
}
.vision-text .word.visible {
  opacity: 1;
  transform: translateY(0);
}
.vision-text .highlight {
  background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── How It Works ── */
#sec-how {
  text-align: center;
}

.how-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 700;
  margin-bottom: 48px;
  color: var(--text);
}

.channels-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  max-width: 800px;
  margin: 0 auto 40px;
}

.channel-card {
  padding: 32px 20px;
  text-align: center;
}

.channel-icon {
  font-size: 2.5rem;
  margin-bottom: 16px;
}

.channel-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 8px;
}

.channel-desc {
  font-size: 0.85rem;
  color: var(--text-dim);
}

.pipeline-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--text-muted);
  font-size: 0.85rem;
  margin: 24px 0;
}

.pipeline-arrow .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--aurora-2);
  animation: dotPulse 2s ease-in-out infinite;
}

@keyframes dotPulse {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* ── Map Section ── */
#sec-map { padding-top: 40px; }

.map-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
}

.map-subtitle {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 32px;
}

.map-container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  position: relative;
  aspect-ratio: 1.3;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: rgba(6,9,15,0.6);
}

.map-container svg { width: 100%; height: 100%; }

.map-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(10,15,26,0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass-hover);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 12px;
  opacity: 0;
  transform: translateY(4px);
  transition: all 0.2s ease;
  z-index: 100;
  min-width: 180px;
}
.map-tooltip.show { opacity: 1; transform: translateY(0); }
.map-tooltip .tt-district { font-family: var(--font-display); font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.map-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; margin: 3px 0; color: var(--text-dim); }
.map-tooltip .tt-val { font-family: var(--font-mono); color: var(--text); }

/* ── Alerts Section ── */
#sec-alerts { text-align: center; }

.alerts-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 700;
  margin-bottom: 8px;
}

.alerts-subtitle {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 40px;
}

.alerts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
  max-width: 1000px;
  margin: 0 auto;
}

.alert-card {
  padding: 20px;
  text-align: left;
  position: relative;
  overflow: hidden;
}

.alert-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}

.alert-card.critical::before { background: var(--red); box-shadow: 0 0 12px rgba(239,68,68,0.3); }
.alert-card.high::before { background: var(--coral); box-shadow: 0 0 12px rgba(249,115,22,0.3); }
.alert-card.medium::before { background: var(--amber); box-shadow: 0 0 12px rgba(245,158,11,0.3); }

.alert-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.alert-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  animation: alertPulse 2s ease-in-out infinite;
}
.alert-dot.critical { background: var(--red); }
.alert-dot.high { background: var(--coral); }
.alert-dot.medium { background: var(--amber); }

@keyframes alertPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
  50% { opacity: 0.7; box-shadow: 0 0 0 4px transparent; }
}

.alert-title {
  font-family: var(--font-display);
  font-size: 0.9rem;
  font-weight: 600;
}

.alert-msg {
  font-size: 0.8rem;
  color: var(--text-dim);
  line-height: 1.5;
  margin-bottom: 10px;
}

.alert-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.alert-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
}

/* ── Cases Section ── */
#sec-cases { text-align: center; }

.cases-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 700;
  margin-bottom: 32px;
}

.cases-table-wrap {
  max-width: 1000px;
  margin: 0 auto;
  overflow-x: auto;
  border-radius: var(--radius);
}

.cases-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.cases-table th {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border-glass);
  position: sticky;
  top: 0;
  background: var(--bg-deep);
}

.cases-table td {
  padding: 10px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  color: var(--text-dim);
  text-align: left;
}

.cases-table tr { transition: background 0.2s; }
.cases-table tr:hover { background: rgba(255,255,255,0.03); }

.case-id {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--accent);
}

.source-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.source-badge.telegram { background: rgba(0,136,204,0.15); color: #0088cc; }
.source-badge.whatsapp { background: rgba(37,211,102,0.15); color: #25d366; }
.source-badge.ussd { background: rgba(245,158,11,0.15); color: #f59e0b; }
.source-badge.sms { background: rgba(167,139,250,0.15); color: #a78bfa; }
.source-badge.manual { background: rgba(255,255,255,0.05); color: var(--text-muted); }

.severity-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}

/* ── Resistance Section ── */
#sec-resistance { text-align: center; }

.resistance-title {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  font-weight: 700;
  margin-bottom: 32px;
}

.resistance-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  max-width: 1000px;
  margin: 0 auto;
}

.drug-bars { display: flex; flex-direction: column; gap: 10px; }

.drug-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.drug-name {
  font-size: 0.8rem;
  color: var(--text-dim);
  width: 110px;
  text-align: right;
  flex-shrink: 0;
}

.drug-bar-track {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.04);
  border-radius: 4px;
  overflow: hidden;
}

.drug-bar-fill {
  height: 100%;
  border-radius: 4px;
  width: 0;
  transition: width 1.2s var(--spring);
}

.drug-pct {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  width: 40px;
  text-align: left;
}

.chart-wrap {
  background: var(--bg-glass);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  padding: 20px;
}

.chart-wrap canvas { width: 100% !important; height: 280px !important; }

/* ── Close Section ── */
#sec-close {
  text-align: center;
  min-height: 60vh;
}

.close-text {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 4vw, 3rem);
  font-weight: 700;
  margin-bottom: 24px;
  background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2), var(--aurora-3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.close-sub {
  color: var(--text-dim);
  font-size: 0.95rem;
  margin-bottom: 40px;
}

.close-links {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

.close-link {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--accent);
  text-decoration: none;
  padding: 8px 20px;

// ── Spring Physics ──
function spring(t, damping = 0.7) {
  return 1 - Math.pow(Math.E, -6 * t) * Math.cos(damping * t * 12);
}

// ── Animated Counter ──
function animateCounter(el, target, suffix = '', duration = 2000) {
  const start = performance.now();
  const isDecimal = target % 1 !== 0;
  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const s = spring(t);
    const val = target * s;
    el.textContent = (isDecimal ? val.toFixed(1) : Math.round(val)) + suffix;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ── Time Ago ──
function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs / 24) + 'd ago';
}

function resColor(pct) {
  if (pct > 60) return '#EF4444';
  if (pct > 40) return '#F59E0B';
  if (pct > 20) return '#00F0FF';
  return '#4ADE80';
}

// ── Severity Color ──
function sevColor(sev) {
  return { critical: '#EF4444', high: '#F97316', medium: '#F59E0B', low: '#00F0FF' }[sev] || '#F59E0B';
}

// ── Map Section ──
async function renderMap() {
  $('map-content').innerHTML = `
    <h2 class="map-title reveal">Africa Under Watch</h2>
    <p class="map-subtitle reveal">15 districts. Real-time resistance monitoring.</p>
    <div class="map-container reveal" id="map-svg-wrap">
      <div class="map-tooltip" id="map-tooltip"></div>
    </div>
  `;

  try {
    const resp = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    const world = await resp.json();
    const africa = topojson.feature(world, world.objects.countries).features.filter(f => {
      const c = f.id;
      return c >= 12 && c <= 90 || [12,24,72,108,120,132,140,148,174,178,180,204,231,232,262,266,270,288,324,384,404,426,430,434,450,454,466,478,480,504,508,516,562,566,624,638,646,678,686,694,706,710,716,728,729,732,736,748,768,788,800,834,854,894].includes(parseInt(c));
    });

    const wrap = $('map-svg-wrap');
    const width = wrap.clientWidth;
    const height = wrap.clientHeight;

    const svg = d3.select(wrap).append('svg')
      .attr('viewBox', `0 0 ${width} ${height}`)
      .attr('preserveAspectRatio', 'xMidYMid meet');

    const projection = d3.geoMercator()
      .center([20, 2])
      .scale(width / 1.2)
      .translate([width / 2, height / 2]);

    const path = d3.geoPath().projection(projection);

    // Draw Africa
    svg.append('g').selectAll('path')
      .data(africa).enter().append('path')
      .attr('d', path)
      .attr('fill', 'rgba(255,255,255,0.03)')
      .attr('stroke', 'rgba(255,255,255,0.06)')
      .attr('stroke-width', 0.5);

    // Arc connections
    const arcPairs = [['Lagos','Accra'],['Nairobi','Mombasa'],['Kampala','Nairobi'],['Johannesburg','Lusaka'],['Kinshasa','Lagos'],['Addis Ababa','Nairobi'],['Accra','Kumasi'],['Dar es Salaam','Mombasa'],['Harare','Lusaka'],['Abuja','Lagos'],['Dakar','Accra'],['Lilongwe','Lusaka']];

    const defs = svg.append('defs');
    arcPairs.forEach(([a, b], i) => {
      const ca = DISTRICT_COORDS[a], cb = DISTRICT_COORDS[b];
      if (!ca || !cb) return;
      const pa = projection(ca), pb = projection(cb);
      if (!pa || !pb) return;
      const grad = defs.append('linearGradient').attr('id', `arc-${i}`)
        .attr('x1', '0%').attr('y1', '0%').attr('x2', '100%').attr('y2', '0%');
      grad.append('stop').attr('offset', '0%').attr('stop-color', '#4ADE80').attr('stop-opacity', 0.3);
      grad.append('stop').attr('offset', '100%').attr('stop-color', '#A78BFA').attr('stop-opacity', 0.3);

      const midX = (pa[0] + pb[0]) / 2;
      const midY = (pa[1] + pb[1]) / 2 - 30;
      svg.append('path')
        .attr('d', `M${pa[0]},${pa[1]} Q${midX},${midY} ${pb[0]},${pb[1]}`)
        .attr('fill', 'none')
        .attr('stroke', `url(#arc-${i})`)
        .attr('stroke-width', 1)
        .attr('stroke-dasharray', '4,4')
        .attr('opacity', 0.4);
    });

    // District points
    const tooltip = $('map-tooltip');
    const mapData = DEMO.map;

    svg.append('g').selectAll('circle')
      .data(mapData).enter().append('circle')
      .attr('cx', d => { const c = DISTRICT_COORDS[d.district]; return c ? projection(c)[0] : 0; })
      .attr('cy', d => { const c = DISTRICT_COORDS[d.district]; return c ? projection(c)[1] : 0; })
      .attr('r', d => 4 + d.active_alerts * 2)
      .attr('fill', d => resColor(d.avg_resistance_pct))
      .attr('fill-opacity', 0.7)
      .attr('stroke', d => resColor(d.avg_resistance_pct))
      .attr('stroke-width', 1)
      .attr('stroke-opacity', 0.3)
      .style('cursor', 'pointer')
      .style('filter', d => `drop-shadow(0 0 6px ${resColor(d.avg_resistance_pct)}40)`)
      .on('mouseenter', function(event, d) {
        d3.select(this).transition().duration(200).attr('r', 10);
        const drugs = d.drugs.map(dr => `<div class="tt-row"><span>${dr.drug}</span><span class="tt-val" style="color:${resColor(dr.pct)}">${dr.pct}%</span></div>`).join('');
        tooltip.innerHTML = `
          <div class="tt-district">${d.district}</div>
          <div class="tt-row"><span>Resistance</span><span class="tt-val">${d.avg_resistance_pct}%</span></div>
          <div class="tt-row"><span>Top Drug</span><span class="tt-val">${d.top_drug}</span></div>
          <div class="tt-row"><span>Alerts</span><span class="tt-val">${d.active_alerts}</span></div>
          <hr style="border:none;border-top:1px solid rgba(255,255,255,0.06);margin:6px 0">
          ${drugs}
        `;
        tooltip.classList.add('show');
      })
      .on('mousemove', function(event) {
        const rect = wrap.getBoundingClientRect();
        tooltip.style.left = (event.clientX - rect.left + 12) + 'px';
        tooltip.style.top = (event.clientY - rect.top - 10) + 'px';
      })
      .on('mouseleave', function() {
        d3.select(this).transition().duration(200).attr('r', d => 4 + d.active_alerts * 2);
        tooltip.classList.remove('show');
      });

  } catch (e) {
    $('map-svg-wrap').innerHTML += '<p style="text-align:center;color:var(--text-muted);padding:40px">Map data unavailable</p>';
  }
}
renderMap();

// ── Resistance Section ──
function renderResistance() {
  const drugBars = DEMO.drugs.map((d, i) => `
    <div class="drug-row reveal reveal-stagger" style="--delay:${i * 60}ms">
      <span class="drug-name">${d.drug}</span>
      <div class="drug-bar-track">
        <div class="drug-bar-fill" data-pct="${d.pct}" style="background: linear-gradient(90deg, ${resColor(d.pct)}80, ${resColor(d.pct)})"></div>
      </div>
      <span class="drug-pct" style="color:${resColor(d.pct)}">${d.pct}%</span>
    </div>
  `).join('');

  $('resistance-content').innerHTML = `
    <h2 class="resistance-title reveal">The Drug War</h2>
    <div class="resistance-grid">
      <div class="drug-bars">${drugBars}</div>
      <div class="chart-wrap glass reveal">
        <canvas id="trend-chart"></canvas>
      </div>
    </div>
  `;

  // Animate bars on reveal
  const barObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.querySelectorAll('.drug-bar-fill').forEach(bar => {
          bar.style.width = bar.dataset.pct + '%';
        });
        barObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });
  barObserver.observe($('sec-resistance'));

  // Chart.js trend
  const ctx = document.getElementById('trend-chart');
  if (ctx && DEMO.trends) {
    const colors = ['#4ADE80', '#2DD4BF', '#A78BFA', '#F59E0B', '#EF4444', '#00F0FF'];
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: DEMO.trends.dates.map(d => d.slice(5)),
        datasets: Object.entries(DEMO.trends.series).map(([name, data], i) => ({
          label: name,
          data,
          borderColor: colors[i % colors.length],
          backgroundColor: colors[i % colors.length] + '10',
          borderWidth: 2,
          pointRadius: 0,
          tension: 0.4,
          fill: false,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'bottom', labels: { color: '#949BA8', font: { family: "'JetBrains Mono'", size: 10 }, boxWidth: 12, padding: 12 } },
          tooltip: { mode: 'index', intersect: false, backgroundColor: '#0A0F1A', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1, titleFont: { family: "'JetBrains Mono'" }, bodyFont: { family: "'JetBrains Mono'" } },
        },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5A6170', font: { family: "'JetBrains Mono'", size: 9 }, maxTicksLimit: 8 } },
          y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5A6170', font: { family: "'JetBrains Mono'", size: 9 }, callback: v => v + '%' }, min: 0, max: 100 },
        },
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
      },
    });
  }
}

// Reveal on scroll
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

function initReveals() {
  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}

// Section detection for Orb mood
const sectionObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      currentSection = entry.target.dataset.section;
      setOrbMood(currentSection);
    }
  });
}, { threshold: 0.4 });

document.querySelectorAll('.section[data-section]').forEach(s => sectionObserver.observe(s));

// Aurora mesh parallax
let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 30;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 30;
  const mesh = $('aurora-mesh');
  if (mesh) {
    mesh.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
  }
});

// Crisis counter animation on reveal
const crisisObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const counter = $('crisis-counter');
      if (counter && !counter.dataset.animated) {
        counter.dataset.animated = '1';
        animateCounter(counter, 1.27, 'M', 2500);
      }
      // Animate stat cards
      entry.target.querySelectorAll('.stat-value[data-count]').forEach(el => {
        if (!el.dataset.animated) {
          el.dataset.animated = '1';
          animateCounter(el, parseInt(el.dataset.count), '', 1800);
        }
      });
      crisisObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.3 });

// Vision word reveal
const visionObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.querySelectorAll('.word').forEach((w, i) => {
        setTimeout(() => w.classList.add('visible'), i * 80);
      });
      visionObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.3 });

  { severity: 'medium', title: 'Rising Amoxicillin Resistance', drug: 'Amoxicillin' },
  { severity: 'medium', title: 'Doxycycline Resistance Pattern', drug: 'Doxycycline' },
];

function weightedRandom(pool, key = 'weight') {
  const total = pool.reduce((sum, item) => sum + item[key], 0);
  let rand = Math.random() * total;
  for (const item of pool) {
    rand -= item[key];
    if (rand <= 0) return item;
  }
  return pool[pool.length - 1];
}

function randomId() {
  return Math.random().toString(36).slice(2, 8);
}

function randomAge() {
  return Math.floor(Math.random() * 75) + 1;
}

function randomSex() {
  return Math.random() > 0.5 ? 'male' : 'female';
}

class LiveDataEngine {
  constructor() {
    this.running = false;
    this.caseCount = 250;
    this.alertCount = 10;
    this.caseWeekCount = 47;
    this.intervalId = null;
  }

  start() {
    if (this.running) return;
    this.running = true;
    const badge = document.getElementById('live-badge');
    if (badge) badge.classList.add('visible');
    setTimeout(() => this.tick(), 3000);
  }

  stop() {
    this.running = false;
    if (this.intervalId) clearTimeout(this.intervalId);
    const badge = document.getElementById('live-badge');
    if (badge) badge.classList.remove('visible');
  }

  tick() {
    if (!this.running) return;
    this.emitCase();
    if (Math.random() < 0.3) {
      setTimeout(() => this.emitAlert(), 500 + Math.random() * 1000);
    }
    this.emitStatsUpdate();
    const delay = 8000 + Math.random() * 7000;
    this.intervalId = setTimeout(() => this.tick(), delay);
  }

  emitCase() {
    this.caseCount++;
    this.caseWeekCount++;
    const district = weightedRandom(DISTRICT_WEIGHTS, 'weight').district;
    const source = weightedRandom(SOURCE_WEIGHTS, 'weight').source;
    const severity = weightedRandom(SEVERITY_WEIGHTS, 'weight').severity;
    const detail = {
      case_id: randomId(),
      source,
      complaint: COMPLAINT_POOL[Math.floor(Math.random() * COMPLAINT_POOL.length)],
      district,
      severity,
      age: randomAge(),
      sex: randomSex(),
      time: 'just now',
    };
    window.dispatchEvent(new CustomEvent('case:new', { detail }));
  }

  emitAlert() {
    this.alertCount++;
    const template = ALERT_TEMPLATES[Math.floor(Math.random() * ALERT_TEMPLATES.length)];
    const district = weightedRandom(DISTRICT_WEIGHTS, 'weight').district;
    const detail = {
      severity: template.severity,
      title: template.title,
      message: `${district}: New resistance pattern detected. ${template.drug} showing decreased efficacy.`,
      district,
      drug: template.drug,
      time: 'just now',
    };
    window.dispatchEvent(new CustomEvent('alert:new', { detail }));
  }

  emitStatsUpdate() {
    window.dispatchEvent(new CustomEvent('stats:update', {
      detail: {
        total_cases: this.caseCount,
        active_alerts: this.alertCount,
        cases_this_week: this.caseWeekCount,
      }
    }));
  }
}

const liveEngine = new LiveDataEngine();

/* ═══════════════════════════════════════════════════════════
   UI REACTIONS — Event Listeners
   ═══════════════════════════════════════════════════════════ */

// ── Case: New ──
window.addEventListener('case:new', (e) => {
  const c = e.detail;
  const tbody = document.getElementById('cases-body');
  if (!tbody) return;
  const row = document.createElement('tr');
  row.className = 'case-row-new';
  row.innerHTML = `
    <td><span class="case-id">${c.case_id}</span></td>
    <td><span class="source-badge ${c.source}">${c.source}</span></td>
    <td><span class="complaint-text">${c.complaint}</span></td>
    <td class="hide-mobile"><span class="district-tag">${c.district}</span></td>
    <td class="hide-mobile">
      <span class="severity-badge">
        <span class="severity-dot ${c.severity}"></span>
        ${c.severity}
      </span>
    </td>
    <td class="hide-mobile" style="font-size:11px;color:var(--text-dim)">${c.age}y ${c.sex === 'male' ? 'M' : 'F'}</td>
    <td><span class="time-ago">${c.time}</span></td>
  `;
  tbody.insertBefore(row, tbody.firstChild);
  row.classList.add('case-row-glow');
  setTimeout(() => row.classList.remove('case-row-glow'), 2000);
  while (tbody.children.length > 15) {
    tbody.removeChild(tbody.lastChild);
  }
  const orb = document.getElementById('orb');
  if (orb) {
    orb.classList.add('orb-case-pulse');
    setTimeout(() => orb.classList.remove('orb-case-pulse'), 500);
  }
});

// ── Alert: New ──
window.addEventListener('alert:new', (e) => {
  const a = e.detail;
  const grid = document.getElementById('alerts-grid');
  if (!grid) return;
  const card = document.createElement('div');
  card.className = `alert-card glass ${a.severity} alert-card-new`;
  card.innerHTML = `
    <div class="alert-header">
      <div class="alert-dot"></div>
      <div class="alert-title">${a.title}</div>
    </div>
    <div class="alert-message">${a.message}</div>
    <div class="alert-meta">
      <span class="alert-tag">${a.district}</span>
      <span class="alert-tag">${a.drug}</span>
      <span class="alert-time">${a.time}</span>
    </div>
  `;
  grid.insertBefore(card, grid.firstChild);
  card.classList.add('alert-card-glow');
  setTimeout(() => card.classList.remove('alert-card-glow'), 2000);
  while (grid.children.length > 12) {
    grid.removeChild(grid.lastChild);
  }
  const orb = document.getElementById('orb');
  if (orb) {
    if (a.severity === 'critical') {
      orb.classList.add('orb-alert-red');
      setTimeout(() => orb.classList.remove('orb-alert-red'), 700);
      showAlertBanner(a);
    } else {
      orb.classList.add('orb-alert-amber');
      setTimeout(() => orb.classList.remove('orb-alert-amber'), 3000);
    }
  }
});

// ── Stats: Update ──
window.addEventListener('stats:update', (e) => {
  const stats = e.detail;
  const statCards = document.querySelectorAll('.stat-card');
  statCards.forEach(card => {
    const label = card.querySelector('.stat-label');
    const value = card.querySelector('.stat-value');
    if (!label || !value) return;
    if (label.textContent.includes('Cases Reported')) {
      animateCounter(value, stats.total_cases);
      value.classList.add('stat-flash');
      setTimeout(() => value.classList.remove('stat-flash'), 700);
    }
    if (label.textContent.includes('Active Alerts')) {
      animateCounter(value, stats.active_alerts);
      value.classList.add('stat-flash-red');
      setTimeout(() => value.classList.remove('stat-flash-red'), 700);
    }
  });
});

// ── Alert Banner ──
function showAlertBanner(alert) {
  const container = document.getElementById('alert-banner-container');
  if (!container) return;
  const banner = document.createElement('div');
  banner.className = 'alert-banner';
  banner.innerHTML = `
    <span class="alert-banner-dot"></span>
    <span class="alert-banner-text"><strong>${alert.title}</strong> — ${alert.district}: ${alert.drug}</span>
    <button class="alert-banner-dismiss" onclick="this.parentElement.classList.add('dismissing'); setTimeout(() => this.parentElement.remove(), 300)">&times;</button>
  `;
  container.appendChild(banner);
  setTimeout(() => {
    if (banner.parentElement) {
      banner.classList.add('dismissing');
      setTimeout(() => banner.remove(), 300);
    }
  }, 5000);
  while (container.children.length > 3) {
    container.removeChild(container.firstChild);
  }
}

// ── Parallax Tilt ──
function initParallaxTilt() {
  const isTouchDevice = 'ontouchstart' in window;
  if (isTouchDevice) return;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) return;
  const tiltCards = document.querySelectorAll('.stat-card, .alert-card');
  tiltCards.forEach(card => {
    card.classList.add('parallax-tilt');
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = `perspective(800px) rotateY(${x * 5}deg) rotateX(${-y * 5}deg)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(800px) rotateY(0) rotateX(0)';
    });
  });
}

// ── Initialize ──
document.addEventListener('DOMContentLoaded', () => {
  initReveals();
  initSectionObservers();
  initParallaxTilt();
  liveEngine.start();
  console.log('[STAI] Initialized');
});

console.log('[STAI] Core loaded');
